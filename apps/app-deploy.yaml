apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app-deploy
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://github.com/Shum4yN1t3/k8s-gitops-platform
    path: app
    targetRevision: HEAD
  destination:
    server: https://kubernetes.default.svc
    namespace: app
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
