apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loadbalancer
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  source:
    repoURL: https://github.com/Shum4yN1t3/k8s-gitops-platform
    path: infrastructure/load-balancer
    targetRevision: HEAD
  destination:
    server: https://kubernetes.default.svc
    namespace: metallb-system
  ignoreDifferences:
    # У MetalLB 7 webhook-ов. caBundle в каждом обновляется cert-rotator'ом
    # во время выполнения, поэтому игнорируем drift для ВСЕХ webhook-ов разом.
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      name: metallb-webhook-configuration
      jqPathExpressions:
        - .webhooks[].clientConfig.caBundle
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      jsonPointers:
        - /status
        - /spec/conversion
        - /spec/conversion/webhook/clientConfig/caBundle
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
