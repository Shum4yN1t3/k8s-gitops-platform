apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: bastion-readonly
  namespace: default
rules:
- apiGroups: [""]
  resources: ["pods", "services"]
  verbs: ["get", "list", "watch"]

- apiGroups: ["apps"]
  resources: ["deployments", "replicasets"]
  verbs: ["get", "list", "watch"]
