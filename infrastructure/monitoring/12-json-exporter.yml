---
apiVersion: v1
kind: ConfigMap
metadata:
  name: json-exporter-config
  namespace: monitoring
data:
  config.yml: |
    modules:
      statuspage:
        metrics:
          - name: status_indicator
            type: gauge
            help: "Service status indicator (0=none, 1=minor, 2=major, 3=critical)"
            path: "{.status.indicator}"
            string_value_mapping:
              map:
                none: 0
                minor: 1
                major: 2
                critical: 3
              error_value: -1
          - name: status_info
            type: gauge
            help: "Service status info (always 1, indicator in label)"
            path: "{.status.indicator}"
            string_value_mapping:
              map:
                none: 1
                minor: 1
                major: 1
                critical: 1
              error_value: 1
            labels:
              indicator: "{.status.indicator}"
              description: "{.status.description}"
              page: "{.page.name}"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: json-exporter
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: json-exporter
  template:
    metadata:
      labels:
        app: json-exporter
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: json-exporter
          image: prometheuscommunity/json-exporter:v0.6.0
          args:
            - --config.file=/etc/json-exporter/config.yml
          ports:
            - containerPort: 7979
              name: http
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: config
              mountPath: /etc/json-exporter
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          readinessProbe:
            tcpSocket:
              port: 7979
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: config
          configMap:
            name: json-exporter-config
---
apiVersion: v1
kind: Service
metadata:
  name: json-exporter
  namespace: monitoring
  labels:
    app: json-exporter
spec:
  selector:
    app: json-exporter
  ports:
    - name: http
      port: 7979
      targetPort: 7979
