# Конфиг Alertmanager содержит Telegram bot_token/chat_id, поэтому хранится
# не в ConfigMap, а в SealedSecret (alertmanager-sealed-secret.yaml).
# Шаблон конфига без секретов — alertmanager.example.yml.
---
# ConfigMap для Telegram-шаблона (ранее отсутствовал — alertmanager не мог стартовать)
apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-templates
  namespace: monitoring
data:
  telegram_alert.tmpl: |
    {{ define "telegram.default.message" }}
    {{ if eq .Status "firing" }}🔥 <b>АЛАРМ [{{ .CommonLabels.severity | toUpper }}]</b>{{ else }}✅ <b>RESOLVED</b>{{ end }}

    <b>Алерт:</b> {{ .CommonLabels.alertname }}
    <b>Namespace:</b> {{ if .CommonLabels.namespace }}{{ .CommonLabels.namespace }}{{ else if .CommonLabels.kubernetes_namespace }}{{ .CommonLabels.kubernetes_namespace }}{{ else }}infrastructure{{ end }}
    <b>Объект:</b> <code>{{ if .CommonLabels.pod }}{{ .CommonLabels.pod }}{{ else if .CommonLabels.node }}{{ .CommonLabels.node }}{{ else if .CommonLabels.instance }}{{ .CommonLabels.instance }}{{ else if .CommonLabels.deployment }}{{ .CommonLabels.deployment }}{{ else if .CommonLabels.daemonset }}{{ .CommonLabels.daemonset }}{{ else }}cluster{{ end }}</code>

    <b>Описание:</b> {{ .CommonAnnotations.description }}

    <b>Статус:</b> {{ if eq .Status "firing" }}🟥 FIRING{{ else }}🟩 RESOLVED{{ end }}
    <b>Активных:</b> {{ .Alerts.Firing | len }} | <b>Решено:</b> {{ .Alerts.Resolved | len }}
    <b>Начало:</b> {{ (index .Alerts 0).StartsAt.Format "15:04:05 02.01.2006" }} UTC
    {{ if eq .Status "resolved" }}<b>Конец:</b> {{ (index .Alerts 0).EndsAt.Format "15:04:05 02.01.2006" }} UTC{{ end }}
    {{ end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  namespace: monitoring
spec:
  revisionHistoryLimit: 2
  replicas: 1
  selector:
    matchLabels:
      app: alertmanager
  template:
    metadata:
      labels:
        app: alertmanager
    spec:
      containers:
      - name: alertmanager
        image: prom/alertmanager:latest
        args: ["--config.file=/etc/alertmanager/alertmanager.yml"]
        ports:
          - containerPort: 9093
        volumeMounts:
        - name: config-volume
          mountPath: /etc/alertmanager
        - name: templates-volume
          mountPath: /etc/alertmanager/templates
      volumes:
      - name: config-volume
        secret:
          secretName: alertmanager-config
      - name: templates-volume
        configMap:
          name: alertmanager-templates
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  namespace: monitoring
spec:
  selector:
    app: alertmanager
  ports:
    - port: 9093
      targetPort: 9093
