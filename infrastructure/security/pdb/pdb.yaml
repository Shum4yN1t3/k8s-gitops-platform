# PDB для ingress-nginx — не допускать полного даунтайма при обновлении нод
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ingress-nginx-pdb
  namespace: ingress-nginx
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ingress-nginx
---
# PDB для Prometheus
apiVersion: policy/v1
