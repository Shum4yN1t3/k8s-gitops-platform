apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ingress-nginx-default-deny
  namespace: ingress-nginx
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ingress-nginx-controller-allow
  namespace: ingress-nginx
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ingress-nginx
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Внешний трафик HTTP/HTTPS
    - ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 443
        # Admission webhook (kube-apiserver -> pod port 8443)
        - protocol: TCP
          port: 8443
  egress:
    # DNS
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Backend: app namespace (app pod + cert-manager acme solver на 8089)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: app
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 8089
    # Backend: monitoring (grafana, prometheus + cert-manager acme solver на 8089)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 3000
        - protocol: TCP
          port: 9090
        - protocol: TCP
          port: 8089
    # Backend: argocd (pod ports: 8080 HTTP, 8443 HTTPS/gRPC + acme solver на 8089)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: argocd
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 8443
        - protocol: TCP
          port: 8089
    # Backend: vault (UI + cert-manager acme solver на 8089)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: vault
      ports:
        - protocol: TCP
          port: 8200
        - protocol: TCP
          port: 8089
    # Backend: vaultwarden (app + cert-manager acme solver pod на 8089)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: vaultwarden
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 8089
    # kube-apiserver (для ingress status updates)
    # ClusterIP kubernetes service
    - to:
        - ipBlock:
            cidr: 10.96.0.1/32
      ports:
        - protocol: TCP
          port: 443
    # Реальный IP мастер-ноды (после DNAT Calico проверяет реальный адрес)
    - to:
        - ipBlock:
            cidr: 203.0.113.10/32
      ports:
        - protocol: TCP
          port: 6443
