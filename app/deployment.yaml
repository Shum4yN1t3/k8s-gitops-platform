apiVersion: apps/v1
kind: Deployment
metadata:
  name: project-test
  namespace: app
spec:
  revisionHistoryLimit: 2
  #replicas: 2
  selector:
    matchLabels:
      app: project-test
  template:
    metadata:
      labels:
        app: project-test
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: project-test
          image: ghcr.io/shum4yn1t3/project-test:sha-50767ef
          ports:
            - containerPort: 8080
          env:
            - name: APP_PORT
              value: "8080"
            - name: APP_NAME
              value: "my-app"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
      imagePullSecrets:
        - name: regcred
