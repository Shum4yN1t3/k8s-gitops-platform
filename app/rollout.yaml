# Бывший Deployment project-test, конвертирован в Argo Rollout:
# canary 20% -> SLO-анализ -> 50% -> SLO-анализ -> 100%.
# Анализ (app/analysis-template.yaml) сверяет долю 5xx и p95/p99 латентность
# с Prometheus; при провале rollout автоматически откатывается.
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: project-test
  namespace: app
spec:
  revisionHistoryLimit: 2
  # replicas управляет KEDA ScaledObject (app/keda-config.yaml)
  selector:
    matchLabels:
      app: project-test
  strategy:
    canary:
      maxSurge: 1
      maxUnavailable: 0
      steps:
        - setWeight: 20
        - analysis:
            templates:
              - templateName: project-test-slo
        - setWeight: 50
        - analysis:
            templates:
              - templateName: project-test-slo
        - setWeight: 100
  template:
    metadata:
      labels:
        app: project-test
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: project-test
          image: ghcr.io/shum4yn1t3/project-test:sha-50767ef
          ports:
            - containerPort: 8080
          env:
            - name: APP_PORT
              value: "8080"
            - name: APP_NAME
              value: "my-app"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
      imagePullSecrets:
        - name: regcred
