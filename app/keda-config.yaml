apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: project-test-scaler
  namespace: app
spec:
  scaleTargetRef:
    name: project-test
  minReplicaCount: 1
  maxReplicaCount: 5
  triggers:
  - type: prometheus
    metadata:
      serverAddress: http://prometheus.monitoring.svc.cluster.local:9090
      threshold: '0.5'
      query: 'sum(rate(container_cpu_usage_seconds_total{container="project-test"}[1m]))'
